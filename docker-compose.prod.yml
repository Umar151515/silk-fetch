services:
    db:
        image: postgres:18-alpine
        container_name: silk-fetch-db
        restart: unless-stopped

        environment:
            POSTGRES_USER: silk_user
            POSTGRES_PASSWORD: silk_pass
            POSTGRES_DB: silk_fetch
            PGUSER: silk_user

        ports:
            - "5432:5432"

        volumes:
            - silk_postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U silk_user -d silk_fetch"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            - silk-network
    backend:    
        build:
            context: .
            target: production
            dockerfile: backend/Dockerfile
        container_name: silk-fetch-backend
        restart: unless-stopped

        environment:
            DATABASE_URL: ${DATABASE_URL}
            TEST_DATABASE_URL: ${TEST_DATABASE_URL}
            TELEGRAM_API_ID: ${TELEGRAM_API_ID}
            TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
        
        ports:
            - "8000:8000"

        depends_on:
            db:
                condition: service_healthy

        env_file:
            - .env

        networks:
            - silk-network

volumes:
  silk_postgres_data:
    driver: local

networks:
  silk-network:
    driver: bridge