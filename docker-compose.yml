services:
    redis_dev:
        image: redis:7-alpine
        container_name: silk-fetch-redis-dev
        restart: unless-stopped

        ports:
            - "6378:6379"

        volumes:
            - redis_data_dev:/data

        networks:
            - silk-network-dev

        healthcheck:
            test: "redis-cli -a ${REDIS_PASSWORD} ping"
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        
        command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    db_dev:
        image: postgres:16-alpine
        container_name: silk-fetch-db-dev
        restart: unless-stopped

        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${TEST_DB_NAME}
            PGUSER: ${DB_USER}

        ports:
            - "5433:5432"

        volumes:
            - silk_postgres_data_dev:/var/lib/postgresql/data

        healthcheck:
            test: "pg_isready -U ${DB_USER} -d ${TEST_DB_NAME}"
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            - silk-network-dev
    backend_dev:    
        build:
            context: .
            target: development
            dockerfile: backend/Dockerfile
        container_name: silk-fetch-backend-dev
        restart: "no"
        
        env_file:
            - .env

        ports:
            - "8001:8000"

        volumes:
            - ./backend:/app/backend

        depends_on:
            db_dev:
                condition: service_healthy
            redis_dev:
                condition: service_healthy

        networks:
            - silk-network-dev

volumes:
    silk_postgres_data_dev:
        driver: local
    redis_data_dev:
        driver: local

networks:
    silk-network-dev:
        driver: bridge