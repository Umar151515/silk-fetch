services:
    db_dev:
        image: postgres:16-alpine
        container_name: silk-fetch-db-dev
        restart: unless-stopped

        environment:
            POSTGRES_USER: silk_user
            POSTGRES_PASSWORD: silk_pass
            POSTGRES_DB: silk_fetch_test
            PGUSER: silk_user

        ports:
            - "5433:5432"

        volumes:
            - silk_postgres_data_dev:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U silk_user -d silk_fetch_test"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

        networks:
            - silk-network-dev
    backend_dev:    
        build:
            context: .
            target: development
            dockerfile: backend/Dockerfile
        container_name: silk-fetch-backend-dev
        restart: "no"

        environment:
            DATABASE_URL: ${DATABASE_URL}
            TEST_DATABASE_URL: ${TEST_DATABASE_URL}
            TELEGRAM_API_ID: ${TELEGRAM_API_ID}
            TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
        
        ports:
            - "8001:8000"

        volumes:
            - ./backend:/app/backend

        depends_on:
            db_dev:
                condition: service_healthy

        env_file:
            - .env

        networks:
            - silk-network-dev

volumes:
  silk_postgres_data_dev:
    driver: local

networks:
  silk-network-dev:
    driver: bridge